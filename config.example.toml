# Copy this file to config.toml and fill in your keys.
# Keys can also come from environment variables:
#   CSFLOAT_API_KEY, WAXPEER_API_KEY, DMARKET_PUBLIC_KEY, DMARKET_SECRET_KEY

[keys]
csfloat = ""
waxpeer = ""
dmarket_public = ""   # hex public key from DMarket account settings
dmarket_secret = ""   # hex secret key (128 hex chars)

[engine]
# "normalized": each input float is scaled to its own skin's range (current CS2 behaviour).
# "legacy":     raw input floats are averaged (pre-update behaviour).
float_formula = "normalized"
# Stay this far below a wear boundary so float32 rounding can't push the output over it.
float_safety_margin = 0.000005

[pricing]
# Outputs are valued at the Skinport sales median of this window, falling back to longer windows.
median_window = "last_7_days"         # last_24_hours | last_7_days | last_30_days | last_90_days
min_sales_volume = 3                  # use a longer window until it has this many sales; flag if none does
cap_at_lowest_listing = true          # never value an output above the cheapest listing on sale right now
# Fee you pay when SELLING the output (0.02 = CSFloat, 0.08 = Skinport, 0.15 = Steam).
# Outputs are valued at Skinport sale prices either way; set both lines to where you actually sell.
sell_fee = 0.02
sell_market = "CSFloat"   # only used to label results
# Rough Doppler / Gamma Doppler phase weights (community estimates, not official).
[pricing.doppler_phase_weights]
"Phase 1" = 0.2
"Phase 2" = 0.2
"Phase 3" = 0.2
"Phase 4" = 0.2
"Ruby" = 0.06
"Sapphire" = 0.06
"Black Pearl" = 0.08
"Emerald" = 0.2

# Extra cost added on top of the listing price when BUYING inputs (deposit/card fees etc).
[buy_fees]
csfloat = 0.0
dmarket = 0.0
waxpeer = 0.0
skinport = 0.0

[markets]
enabled = ["csfloat", "dmarket", "waxpeer"]
include_trade_locked = false   # Waxpeer/DMarket listings still under Steam trade hold

[rate_limits]   # requests per second
csfloat = 3.0      # bursts are fine, but the quota is 200 requests per window (x-ratelimit-* headers)
dmarket = 10.0     # measured: 30 requests/second; 2026-10-16: 160 requests at 20/s, no 429
waxpeer = 3.0      # get-items-list measured 2026-10-16: 150 requests at 5/s, no 429 (20/min is search-by-name)
skinport = 0.025   # documented: 8 per 5 minutes

[scan]
top_candidates = 0           # 0 = check every idea on real listings (most promising first); N = only the best N
time_limit_minutes = 10      # `tradeup scan` stops asking markets after this long (0 = no limit)
listing_cache_minutes = 30   # listings are reused this long, so repeated scans pick up where the last one ended
csfloat_reserve = 30         # CSFloat requests kept back from scanning for re-checking chosen listings
max_results = 10
min_roi = 0.0                # 0.05 = only show contracts with >= 5% expected ROI
max_contract_cost = 0        # USD, 0 = no limit
fetch_float_slack = 2.0      # fetch listings up to this multiple of the required avg normalized float
confirm_top = 3              # re-check this many best results are still for sale (CSFloat: 1 request per listing)

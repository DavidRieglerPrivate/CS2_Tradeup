[project]
name = "cs2tradeup"
version = "0.1.0"
description = "CS2 trade-up contract calculator and cross-market profitability scanner"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "brotli>=1.1",
    "typer>=0.12",
    "rich>=13.7",
    "ortools>=9.10",
    "pynacl>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradeup = "cs2tradeup.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cs2tradeup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
